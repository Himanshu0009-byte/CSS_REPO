<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS TYPES</title>
    <style>
        h2{
            color: brown;
            background-color: black;
        }
    </style>
    <link rel="stylesheet" href="style.css">
<!-- mainly there are 3 type of CSS which we can use to style our html web page
1.inline css
mainly here style attribute comes under the tage and define the property and declaration.
2.internal css
here we use style tag under head tag in which we select a particular selector which we want to style and and define their colour and properties
3.external css
In external css mainly we make a external file of css and then work on the style and then we link this css file with our html web page by using link:css tag
mainly external css is used -->
</head>
<body>
    <h1 style="color: blue;background-color: aqua;">INLINE CSS</h1>
    <h2>INTERNAL CSS</h2>
    <h3>EXTERNAL CSS</h3>
</body>
</html>
